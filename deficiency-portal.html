<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Deficiencies Dashboard — Termac One</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#F5F6F8;color:#1A1D21;font-size:14px;line-height:1.5}
.hdr{background:#1A1D21;border-bottom:4px solid #C8102E;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;color:#fff;letter-spacing:.02em}
.hdr-title span{color:#C8102E}
.hdr-back{color:#9CA3AF;text-decoration:none;font-size:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 60px}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(26,29,33,.08);border-top:3px solid #C8102E}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px}
.kpi-lbl{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px}
.board{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:16px;align-items:start}
.col-hdr{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#374151;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.col-count{background:#E5E7EB;color:#374151;border-radius:10px;padding:1px 9px;font-size:11px;font-weight:800}
.col-hdr.jeopardy .col-count{background:#FEE2E2;color:#991B1B}
.col-hdr.new .col-count{background:#DCFCE7;color:#166534}
.col-hdr.monitor .col-count{background:#EFF6FF;color:#1E40AF}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#374151;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.def-card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(26,29,33,.08);padding:14px 16px;margin-bottom:10px;border-left:4px solid #6B7280}
.def-card.critical{border-left-color:#C8102E}
.def-card.moderate{border-left-color:#D97706}
.def-card.minor{border-left-color:#0D7490}
.def-card.jeopardy{border-left-color:#991B1B;background:#FEF2F2}
.def-acct{font-weight:700;font-size:14px}
.def-addr{font-size:12px;color:#6B7280;margin-top:1px}
.def-equip{font-weight:600;font-size:13px;margin-top:8px}
.def-desc{font-size:12px;color:#4B5563;margin-top:2px;line-height:1.5}
.def-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.badge{border-radius:4px;padding:2px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.badge.critical{background:#FEE2E2;color:#991B1B}
.badge.moderate{background:#FEF3C7;color:#92400E}
.badge.minor{background:#E0F2FE;color:#075985}
.badge.status-needs_quote{background:#F3F4F6;color:#374151}
.badge.status-quote_sent{background:#EFF6FF;color:#1E40AF}
.badge.status-signed{background:#DCFCE7;color:#166534}
.badge.jeopardy-tag{background:#991B1B;color:#fff}
.def-aging-days{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px}
.def-aging-days.fresh{color:#166534}
.def-aging-days.watch{color:#92400E}
.def-aging-days.urgent{color:#C8102E}
.def-actions{margin-top:10px;display:flex;gap:8px}
.btn{border:none;border-radius:6px;padding:7px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.btn-primary{background:#C8102E;color:#fff}
.btn-ghost{background:#F3F4F6;color:#374151}
.empty{text-align:center;padding:30px 16px;color:#9CA3AF;font-size:12px;background:#fff;border-radius:10px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;width:min(480px,100%);max-height:88vh;overflow-y:auto}
.modal-hdr{background:#1A1D21;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px}
.modal-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.modal-body{padding:18px}
.field-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;display:block;margin-bottom:4px;margin-top:12px}
.field-lbl:first-child{margin-top:0}
.field{width:100%;padding:9px 11px;border:1.5px solid #D7DBE0;border-radius:7px;font-size:14px;font-family:'Barlow',sans-serif;box-sizing:border-box}
textarea.field{resize:vertical}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">🔧 <span>Deficiencies Dashboard</span></div>
  <a href="employee-portal.html" style="background:#C8102E;border:1.5px solid #C8102E;border-radius:7px;color:#fff;font-family:Barlow,sans-serif;font-weight:700;font-size:11px;letter-spacing:.10em;text-transform:uppercase;padding:6px 14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px">🏠 Employee Portal</a>
</div>

<div class="wrap">
  <div class="kpi-row" id="kpiRow"></div>

  <div class="board">
    <div>
      <div class="col-hdr new">🆕 New — Just Arrived <span class="col-count" id="cntNew">0</span></div>
      <div id="colNew"></div>
    </div>
    <div>
      <div class="col-hdr monitor">📋 Quoted — Monitoring <span class="col-count" id="cntMonitor">0</span></div>
      <div id="colMonitor"></div>
    </div>
    <div>
      <div class="col-hdr jeopardy">🔴 In Jeopardy <span class="col-count" id="cntJeopardy">0</span></div>
      <div id="colJeopardy"></div>
    </div>
  </div>
</div>

<!-- WRITE QUOTE MODAL -->
<div class="modal-bg" id="quoteModal">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="quoteModalTitle">✍️ Write Quote</div>
      <button class="modal-close" onclick="closeQuoteModal()">✕</button>
    </div>
    <div class="modal-body" id="quoteModalBody"></div>
  </div>
</div>

<script>
// ── BUILD DEFICIENCY ID (stable across renders) ──
function defId(item){ return item.id || (item.account + '|' + item.equipment + '|' + item.ts); }

// ── STATUS — three-stage lifecycle: needs a quote written, quote sent
// and awaiting customer signature, or signed/approved. This is what the
// aging view and KPI counts are built on. ──
function defGetStatus(item){
  if (item.quoteSigned) return 'signed';
  if (item.quoteSent) return 'quote_sent';
  return 'needs_quote';
}
var STATUS_LABEL = { needs_quote:'Needs Quote', quote_sent:'Quote Sent — Awaiting Signature', signed:'Signed' };

function crmLoad(key){ try{ return JSON.parse(localStorage.getItem('termac_crm_'+key)||'[]'); }catch(e){ return []; } }

// ── LOAD + NORMALIZE DEFICIENCY DATA from officeQueue + account/location activityLog ──
function loadDeficiencies(){
  let queue = [];
  try { queue = JSON.parse(localStorage.getItem('officeQueue') || '[]').filter(function(q){ return q.type === 'deficiency'; }); } catch(e) {}

  var accounts = crmLoad('accounts');
  var seen = new Set(queue.map(function(q){ return defId(q); }));

  accounts.forEach(function(acct) {
    var locs = (acct.locations && acct.locations.length) ? acct.locations : [{
      id: acct.id, name: acct.business || acct.name || 'Account',
      address: acct.address || '', activityLog: acct.activityLog || []
    }];

    locs.forEach(function(loc) {
      var parentName = acct.name || acct.business || '';
      var locName = loc.name || parentName;
      var displayName = (parentName && locName && parentName !== locName) ? (parentName + ' - ' + locName) : locName;

      var log = loc.activityLog || acct.activityLog || [];
      log.forEach(function(entry) {
        if (entry.type === 'tech' && entry.icon === '⚠️') {
          var fakeItem = { ts: entry.ts, account: displayName, equipment: (entry.title||'').replace(/^Deficiency Flagged ?(\[.*?\])? ?,? ?/,'') || 'Equipment' };
          var id = defId(fakeItem);
          if (!seen.has(id)) {
            seen.add(id);
            queue.push({
              id: id, ts: entry.ts, account: displayName, address: loc.address || acct.address || '',
              equipment: fakeItem.equipment || 'Equipment', description: entry.note || '',
              severity: entry.title && entry.title.toLowerCase().includes('critical') ? 'critical' : entry.title && entry.title.toLowerCase().includes('major') ? 'critical' : entry.title && entry.title.toLowerCase().includes('moderate') ? 'moderate' : 'minor',
              techName: entry.who || 'Tech', quoteSent: entry.quoteSent || false,
              _acctId: acct.id, _locId: loc.id || null, _logTs: entry.ts
            });
          }
        }
      });
    });
  });

  // Seed demo data if nothing exists yet
  if (!queue.length) {
    var now = Date.now();
    queue = [
      { id:'seed1', ts:now-3600000*2, account:'Ferraro Ristorante', address:'1204 Walnut St, Philadelphia PA 19103', equipment:'Extinguisher #3, kitchen entrance', description:'Pressure gauge sitting in the red during the drill, needs recharge or replacement', severity:'critical', techName:'Brad Fickes' },
      { id:'seed2', ts:now-3600000*5, account:'Midtown Office Plaza', address:'1701 JFK Blvd, Philadelphia PA 19103', equipment:'Exit light, 3rd floor stairwell', description:'Battery backup failed, unit not illuminating on test', severity:'moderate', techName:'Chris Carzo' },
      { id:'seed3', ts:now-86400000,  account:'Eastside Grille', address:'892 Spring Garden St, Philadelphia PA 19123', equipment:'Hood suppression nozzle, Station 2', description:'Nozzle blocked, grease accumulation preventing full coverage', severity:'moderate', techName:'Dan Rini', quoteSent:true },
      { id:'seed4', ts:now-86400000*2, account:'Harbor View Hotel', address:'410 Dockside Ave, Wilmington DE 19801', equipment:'Sprinkler head, Banquet hall', description:'Corroded head, replace before next inspection cycle', severity:'minor', techName:'Tom Jordan' },
      { id:'seed5', ts:now-86400000*9, account:'Wu Dim Sum Palace', address:'927 Race St, Philadelphia PA 19107', equipment:'Extinguisher #1, front entrance', description:'Tag expired, no location signage', severity:'critical', techName:'Brad Fickes', quoteSent:true },
    ];
  }

  queue.forEach(function(item) { item._id = defId(item); item._status = defGetStatus(item); });
  // Oldest first — the whole point of this view is knowing which ones have
  // been sitting the longest and need a follow-up push, not what just came in.
  queue.sort(function(a,b){ return a.ts - b.ts; });
  return queue;
}

function escH(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function daysAgo(ts){ return Math.floor((Date.now() - ts) / 86400000); }
function agingClass(days){ return days >= 5 ? 'urgent' : days >= 2 ? 'watch' : 'fresh'; }

// ── TIER CLASSIFICATION ──
// New: needs a quote and just came in (under 24h) — hasn't had a chance
// to be actioned yet, distinct from one that's been sitting untouched.
// Monitoring: quote's out, waiting on the customer to sign, not yet stale.
// Jeopardy: needs_quote sitting 3+ days untouched (real risk of losing
// the fix or the upsell), OR a sent quote sitting 5+ days with no
// response (customer's gone quiet) — either way it needs a manager's
// or Lexi's direct follow-up push, not just routine monitoring.
function defTier(item){
  var days = daysAgo(item.ts);
  if (item._status === 'signed') return 'signed';
  if (item._status === 'needs_quote') return days >= 3 ? 'jeopardy' : 'new';
  if (item._status === 'quote_sent') return days >= 5 ? 'jeopardy' : 'monitor';
  return 'new';
}

// ── PERSIST: write a quote back onto the real record it came from ──
function saveQuoteToItem(itemId, amount, notes){
  var items = loadDeficiencies();
  var item = items.find(function(i){ return i._id === itemId; });
  if (!item) return;

  if (item._acctId) {
    // Came from an account/location activityLog entry — write back there
    var accounts = crmLoad('accounts');
    var acct = accounts.find(function(a){ return a.id === item._acctId; });
    if (acct) {
      var loc = (acct.locations||[]).find(function(l){ return l.id === item._locId; });
      var log = loc ? (loc.activityLog || (loc.activityLog=[])) : (acct.activityLog || (acct.activityLog=[]));
      var entry = log.find(function(e){ return e.ts === item._logTs; });
      if (entry) {
        entry.quoteSent = true;
        entry.quoteAmount = amount;
        entry.quoteNotes = notes;
        entry.quoteSentAt = Date.now();
      }
      localStorage.setItem('termac_crm_accounts', JSON.stringify(accounts));
    }
  } else {
    // Came from officeQueue directly
    try {
      var q = JSON.parse(localStorage.getItem('officeQueue') || '[]');
      var rec = q.find(function(x){ return defId(x) === itemId; });
      if (rec) { rec.quoteSent = true; rec.quoteAmount = amount; rec.quoteNotes = notes; rec.quoteSentAt = Date.now(); }
      localStorage.setItem('officeQueue', JSON.stringify(q));
    } catch(e) {}
  }
}

function nudgeCustomer(itemId){
  var items = loadDeficiencies();
  var item = items.find(function(i){ return i._id === itemId; });
  if (!item) return;
  var subj = encodeURIComponent('Following up — quote for ' + (item.equipment||'deficiency') + ' at ' + (item.account||''));
  var body = encodeURIComponent('Hi,\n\nFollowing up on the quote sent for the deficiency noted at ' + (item.account||'') + ' (' + (item.equipment||'') + '). Let us know if you have any questions or would like to move forward.\n\nThanks,\nTermac');
  window.open('mailto:?subject=' + subj + '&body=' + body, '_blank');
}

// ── QUOTE MODAL ──
var _quoteModalItemId = null;
function openQuoteModal(itemId){
  _quoteModalItemId = itemId;
  var items = loadDeficiencies();
  var item = items.find(function(i){ return i._id === itemId; });
  if (!item) return;
  document.getElementById('quoteModalTitle').textContent = '✍️ Write Quote — ' + item.account;
  document.getElementById('quoteModalBody').innerHTML =
    '<div style="font-size:12px;color:#6B7280;margin-bottom:4px">' + escH(item.equipment||'') + '</div>' +
    '<div style="font-size:12px;color:#4B5563;margin-bottom:14px">' + escH(item.description||'') + '</div>' +
    '<label class="field-lbl">Quote Amount ($)</label>' +
    '<input class="field" id="quoteAmt" type="number" step="0.01" placeholder="0.00">' +
    '<label class="field-lbl">Notes / Scope</label>' +
    '<textarea class="field" id="quoteNotes" rows="3" placeholder="What\'s included, parts needed, timeline..."></textarea>' +
    '<div style="display:flex;gap:10px;margin-top:16px">' +
      '<button class="btn btn-ghost" style="flex:1;padding:10px" onclick="closeQuoteModal()">Cancel</button>' +
      '<button class="btn btn-primary" style="flex:1;padding:10px" onclick="submitQuote()">Send Quote</button>' +
    '</div>';
  document.getElementById('quoteModal').classList.add('open');
}
function closeQuoteModal(){
  document.getElementById('quoteModal').classList.remove('open');
  _quoteModalItemId = null;
}
function submitQuote(){
  var amt = parseFloat(document.getElementById('quoteAmt').value) || 0;
  if (!amt) { alert('Enter a quote amount.'); return; }
  var notes = document.getElementById('quoteNotes').value.trim();
  saveQuoteToItem(_quoteModalItemId, amt, notes);
  closeQuoteModal();
  render();
}

function buildDefCard(item, jeopardy){
  var days = daysAgo(item.ts);
  return '<div class="def-card ' + item.severity + (jeopardy?' jeopardy':'') + '">' +
    '<div class="def-acct">' + escH(item.account) + '</div>' +
    '<div class="def-addr">📍 ' + escH(item.address||'') + '</div>' +
    '<div class="def-equip">' + escH(item.equipment) + '</div>' +
    '<div class="def-desc">' + escH(item.description||'') + '</div>' +
    '<div class="def-meta">' +
      '<span class="badge ' + item.severity + '">' + item.severity + '</span>' +
      '<span class="badge status-' + item._status + '">' + STATUS_LABEL[item._status] + '</span>' +
      (jeopardy ? '<span class="badge jeopardy-tag">' + days + 'd — needs push</span>' : '<span class="def-aging-days ' + agingClass(days) + '">' + days + 'd open</span>') +
    '</div>' +
    '<div style="font-size:11px;color:#9CA3AF;margin-top:4px">Flagged by ' + escH(item.techName||'Tech') +
      (item.quoteAmount ? ' &middot; Quoted $' + Number(item.quoteAmount).toFixed(2) : '') + '</div>' +
    '<div class="def-actions">' +
      (item._status === 'needs_quote' ? '<button class="btn btn-primary" onclick="openQuoteModal(\'' + item._id + '\')">✍️ Write Quote</button>' : '') +
      (item._status === 'quote_sent' ? '<button class="btn btn-ghost" onclick="nudgeCustomer(\'' + item._id + '\')">🔔 Nudge Customer</button>' : '') +
    '</div>' +
  '</div>';
}

function render(){
  var items = loadDeficiencies();
  var active = items.filter(function(i){ return i._status !== 'signed'; });
  var tiers = { new:[], monitor:[], jeopardy:[] };
  active.forEach(function(i){
    var t = defTier(i);
    if (tiers[t]) tiers[t].push(i);
  });

  var needsQuote = active.filter(function(i){ return i._status === 'needs_quote'; }).length;
  var awaitingSig = active.filter(function(i){ return i._status === 'quote_sent'; }).length;
  var oldestDays = active.length ? Math.max.apply(null, active.map(function(i){ return daysAgo(i.ts); })) : 0;

  document.getElementById('kpiRow').innerHTML =
    '<div class="kpi"><div class="kpi-val">' + active.length + '</div><div class="kpi-lbl">Open Deficiencies</div></div>' +
    '<div class="kpi" style="border-top-color:#166534"><div class="kpi-val">' + tiers.new.length + '</div><div class="kpi-lbl">New / Just Arrived</div></div>' +
    '<div class="kpi" style="border-top-color:#1E40AF"><div class="kpi-val">' + awaitingSig + '</div><div class="kpi-lbl">Awaiting Signature</div></div>' +
    '<div class="kpi" style="border-top-color:#991B1B"><div class="kpi-val">' + tiers.jeopardy.length + '</div><div class="kpi-lbl">In Jeopardy</div></div>' +
    '<div class="kpi" style="border-top-color:#C8102E"><div class="kpi-val">' + oldestDays + 'd</div><div class="kpi-lbl">Oldest Pending</div></div>';

  document.getElementById('cntNew').textContent = tiers.new.length;
  document.getElementById('cntMonitor').textContent = tiers.monitor.length;
  document.getElementById('cntJeopardy').textContent = tiers.jeopardy.length;

  document.getElementById('colNew').innerHTML = tiers.new.length
    ? tiers.new.sort(function(a,b){return a.ts-b.ts;}).map(function(i){ return buildDefCard(i,false); }).join('')
    : '<div class="empty">Nothing new right now.</div>';
  document.getElementById('colMonitor').innerHTML = tiers.monitor.length
    ? tiers.monitor.sort(function(a,b){return a.ts-b.ts;}).map(function(i){ return buildDefCard(i,false); }).join('')
    : '<div class="empty">Nothing out for signature right now.</div>';
  document.getElementById('colJeopardy').innerHTML = tiers.jeopardy.length
    ? tiers.jeopardy.sort(function(a,b){return a.ts-b.ts;}).map(function(i){ return buildDefCard(i,true); }).join('')
    : '<div class="empty">✅ Nothing in jeopardy.</div>';
}

render();
</script>
</body>
</html>

name: AllProDuctScan
options:
  bundleIdPrefix: com.termac.allpro
  deploymentTarget:
    iOS: "16.0"
configs:
  Release: release
  Debug: debug
targets:
  AllProDuctScan:
    type: application
    platform: iOS
    sources:
      - Sources/AllProDuctScan
    info:
      path: Sources/AllProDuctScan/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "AllPro Duct Scan uses the camera and LiDAR sensor to measure the vertical run from the hood collar to the underside of the deck, and to flag obstacles in the ceiling cavity."
        UIRequiredDeviceCapabilities: [arkit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termac.allpro.ductscan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    entitlements:
      path: Sources/AllProDuctScan/AllProDuctScan.entitlements
      properties: {}

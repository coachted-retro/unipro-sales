name: ServiceTrade Full Sync

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'Max batches per call (100 = default)'
        required: false
        default: '100'
      passes:
        description: 'How many times to call sync-many (default 5)'
        required: false
        default: '5'

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Resume ServiceTrade sync to D1
    timeout-minutes: 55
    steps:
      - name: Run sync passes
        run: |
          BATCHES="${{ github.event.inputs.batches }}"
          BATCHES=${BATCHES:-100}
          PASSES="${{ github.event.inputs.passes }}"
          PASSES=${PASSES:-5}
          WORKER="https://servicetrade-sync.termac-one.workers.dev"

          for i in $(seq 1 $PASSES); do
            echo "=== Pass $i of $PASSES ==="
            RESPONSE=$(curl -s --max-time 600 -X POST "${WORKER}/sync-many?batches=${BATCHES}" || echo '{"ok":false,"error":"curl timeout"}')
            echo "Response: $RESPONSE"

            DONE=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('done',False))" 2>/dev/null || echo "False")
            OK=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ok',False))" 2>/dev/null || echo "False")

            if [ "$DONE" = "True" ]; then
              echo "Sync fully complete after pass $i."
              exit 0
            fi

            if [ "$OK" != "True" ]; then
              echo "::warning::Pass $i returned ok=false -- token may have expired, continuing to next pass"
            fi

            echo "Pass $i done. Continuing to next pass..."
            sleep 5
          done

          echo "Completed $PASSES passes. Run again if sync is not yet done."

      - name: Final status check
        if: always()
        run: |
          STATUS=$(curl -s --max-time 15 "https://servicetrade-sync.termac-one.workers.dev/sync-status" || echo '{}')
          echo "Final sync status: $STATUS"

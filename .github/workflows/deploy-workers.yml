name: Deploy Cloudflare Workers

# Deploys all Cloudflare Workers on any push to main that touches workers/.
#
# 2026-07-21: Added SSO_CLIENT_ID guard -- deployment will REFUSE to proceed
# if wrangler.toml contains the old/wrong client ID. This protects the login
# for all staff. DO NOT change SSO_CLIENT_ID without updating this guard.
# CORRECT ID: cdab96ff-2083-48fe-a359-2900a189f2fd (Termac One app, owned by tscholl@termac.com)
# WRONG ID:   703deca4-b245-49d5-8d17-f354d906321b (old Altek-managed app, DEAD)

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Workers to termac-one
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      # ── CRITICAL GUARD: Reject deploy if wrong SSO client ID is present ──
      # This prevents the old Altek app ID from ever being deployed again.
      # If this step fails, fix wrangler.toml to use cdab96ff before deploying.
      - name: Verify SSO_CLIENT_ID is correct
        run: |
          CORRECT_ID="cdab96ff-2083-48fe-a359-2900a189f2fd"
          WRONG_ID="703deca4-b245-49d5-8d17-f354d906321b"
          TOML="workers/termac-staff-auth/wrangler.toml"

          if grep -q "$WRONG_ID" "$TOML"; then
            echo "::error::DEPLOYMENT BLOCKED -- wrangler.toml contains the WRONG SSO client ID ($WRONG_ID). This is the dead Altek app registration. Update SSO_CLIENT_ID to $CORRECT_ID in $TOML and try again."
            exit 1
          fi

          if ! grep -q "$CORRECT_ID" "$TOML"; then
            echo "::error::DEPLOYMENT BLOCKED -- wrangler.toml does not contain the correct SSO client ID ($CORRECT_ID). Check workers/termac-staff-auth/wrangler.toml before deploying."
            exit 1
          fi

          echo "SSO_CLIENT_ID verified correct: $CORRECT_ID"

      - name: Deploy all workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKERS="unipro-ai-proxy ors-route-proxy termac-notify termac-chat cms-cors-proxy outscraper-proxy termac-photo-upload termac-d1-api termac-booking-api termac-hotlead-escalation termac-staff-auth termac-vault-docs bid-scraper bid-alert-parser servicetrade-sync"
          FAILED=""
          DEPLOYED=""
          for w in $WORKERS; do
            echo "::group::Deploying $w"
            if (cd "workers/$w" && wrangler deploy); then
              echo "$w deployed OK"
              DEPLOYED="$DEPLOYED $w"
            else
              echo "::error::Deploy FAILED for $w"
              FAILED="$FAILED $w"
            fi
            echo "::endgroup::"
          done

          {
            echo "## Worker deploy results"
            echo ""
            echo "**Deployed:**${DEPLOYED:- none}"
            echo ""
            echo "**Failed:**${FAILED:- none}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$FAILED" ]; then
            echo "::error::One or more workers failed to deploy:$FAILED"
            exit 1
          fi

      - name: Health check termac-staff-auth
        run: |
          URL="https://termac-staff-auth.termac-one.workers.dev/my-access?email=healthcheck@termac.com"
          echo "Checking $URL"
          for i in 1 2 3 4 5; do
            BODY=$(curl -s --max-time 10 "$URL" || true)
            echo "Attempt $i response: $BODY"
            if echo "$BODY" | grep -q '"ok":true'; then
              echo "termac-staff-auth is responding correctly."
              exit 0
            fi
            sleep 5
          done
          echo "::error::termac-staff-auth did NOT respond correctly after deploy. Login may be broken."
          exit 1

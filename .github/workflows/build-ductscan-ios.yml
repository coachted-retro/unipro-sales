name: Build AllPro Duct Scan (iOS)

# This file needs to live at .github/workflows/build-ductscan-ios.yml in the
# repo root, not inside allpro-ductscan-ios/. It's kept here for now so it
# doesn't clash with the existing Worker deploy workflows during review.

on:
  push:
    paths:
      - 'allpro-ductscan-ios/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: allpro-ductscan-ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Signing needs an Apple Developer Program account (see PR notes).
      # Until DEVELOPMENT_TEAM / signing secrets are set in repo settings,
      # this step builds unsigned and stops short of producing an installable
      # .ipa — it's here so syntax/compile errors surface on every push even
      # before signing is wired up.
      - name: Build (unsigned, compile check only)
        if: ${{ !secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project AllProDuctScan.xcodeproj \
            -scheme AllProDuctScan \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Import signing certificate
        if: ${{ secrets.IOS_TEAM_ID }}
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive and export signed build
        if: ${{ secrets.IOS_TEAM_ID }}
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project AllProDuctScan.xcodeproj \
            -scheme AllProDuctScan \
            -configuration Release \
            -archivePath build/AllProDuctScan.xcarchive \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            archive
          xcodebuild -exportArchive \
            -archivePath build/AllProDuctScan.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Upload build artifact
        if: ${{ secrets.IOS_TEAM_ID }}
        uses: actions/upload-artifact@v4
        with:
          name: AllProDuctScan-ipa
          path: allpro-ductscan-ios/build/export/*.ipa

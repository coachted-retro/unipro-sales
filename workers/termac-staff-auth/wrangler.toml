name = "termac-staff-auth"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "termac-crm"
database_id = "3ea2282d-e655-477b-9d5e-560be2a1b40b"

# Entra SSO (Altek), added 2026-07-17. Client ID and Tenant ID are not
# secret (Azure exposes both in the app registration's own URLs) so they
# live here as plain vars. The client secret is NOT committed -- it must
# be set once via `wrangler secret put SSO_CLIENT_SECRET` (run from inside
# workers/termac-staff-auth) or through the Cloudflare dashboard under
# this worker's Settings -> Variables -> Secrets. Deploys will fail the
# /sso-exchange endpoint (not the whole worker) until that secret exists.
[vars]
SSO_CLIENT_ID = "703deca4-b245-49d5-8d17-f354d906321b"
SSO_TENANT_ID = "62642d6d-0c0a-4cba-be8c-5c83f0020c57"
SSO_REDIRECT_URI = "https://my.termac.com/auth/callback"

# Service binding needed here — set in the Cloudflare dashboard under
# this worker's Settings -> Bindings after this deploys, same as
# termac-hotlead-escalation earlier tonight.
[[services]]
binding = "NOTIFY_SERVICE"
service = "termac-notify"

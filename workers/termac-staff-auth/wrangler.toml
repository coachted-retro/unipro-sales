name = "termac-staff-auth"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "termac-crm"
database_id = "3ea2282d-e655-477b-9d5e-560be2a1b40b"

# Cron: fire hourly to process payment reminder drip queue
[triggers]
crons = ["0 * * * *"]

# Entra SSO -- new app registration created 2026-07-21, owned by Ted Scholl
# (tscholl@termac.com). Client ID and Tenant ID are not secret.
# Client secret is set via Cloudflare dashboard -> termac-staff-auth -> Settings -> Variables.
[vars]
SSO_CLIENT_ID = "cdab96ff-2083-48fe-a359-2900a189f2fd"
SSO_TENANT_ID = "62642d6d-0c0a-4cba-be8c-5c83f0020c57"
SSO_REDIRECT_URI = "https://sales.mytermac.com/auth/callback"
# Square webhook signature key -- set in Cloudflare dashboard -> Variables (secret)
# SQUARE_WEBHOOK_SIGNATURE_KEY = "set-in-cloudflare-dashboard"
# Square payment links -- set once after TerPro LLC Square account is active
# SQUARE_DRAW_LINK = "https://square.link/..."
# SQUARE_FINAL_LINK = "https://square.link/..."

[[services]]
binding = "NOTIFY_SERVICE"
service = "termac-notify"

name = "unipro-ai-proxy"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[triggers]
# Daily digest - runs every morning regardless of whether anyone has the
# app open. 11:00 UTC = ~6-7am Eastern depending on DST.
crons = ["0 11 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "termac-crm"
database_id = "3ea2282d-e655-477b-9d5e-560be2a1b40b"

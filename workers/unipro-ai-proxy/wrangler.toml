name = "unipro-ai-proxy"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[triggers]
# Hourly, not daily - 2026-07-13 per Ted's Report Settings admin tab.
# Cloudflare Cron Triggers are fixed at deploy time, so a "change the
# send time" setting can't actually move this schedule without a
# redeploy every time someone adjusts it. Running hourly and checking
# each report's configured send_hour_utc in report_settings against the
# current hour achieves real self-service control without that -- one
# extra cheap invocation 23 times a day that does nothing when no report
# is due, well within Workers' free/low-cost execution limits.
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "termac-crm"
database_id = "3ea2282d-e655-477b-9d5e-560be2a1b40b"

# 2026-07-13: Report Settings' runScheduledReports() needs to call
# termac-notify's /send-report endpoint. Cloudflare blocks a Worker from
# fetch()-ing another Worker's public *.workers.dev URL directly (returns
# error 1042, a plain-text page, not JSON) -- same issue already solved
# for termac-booking-api. Use this Service Binding (env.NOTIFY_SERVICE),
# not a raw fetch to the public URL. Must also be added under this
# worker's Settings -> Bindings in the dashboard so it survives a
# redeploy from GitHub Actions, per the note in CLAUDE.md.
[[services]]
binding = "NOTIFY_SERVICE"
service = "termac-notify"

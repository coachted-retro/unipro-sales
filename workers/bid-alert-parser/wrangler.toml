name = "bid-alert-parser"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

# Same BID_ALERTS namespace bid-scraper reads from -- this Worker is what
# actually writes bids:PA and bids:NJ into it. Both Workers must point at
# the identical namespace id for this to connect end to end.
[[kv_namespaces]]
binding = "BID_ALERTS"
id = "d8e7120cdcbf4999bafe274e1e28fefc"

# Required to receive PA e-Alert / NJSTART emails via Cloudflare Email
# Routing -- set this up in the Cloudflare dashboard under Email Routing,
# pointing a route at this Worker. This is the piece that can't be done
# from a config file; it's a routing rule tied to your domain's DNS.
# See the comment block at the top of index.js for the alternative HTTP
# webhook transport (Brevo/SendGrid inbound parse) if that's a better fit
# than Cloudflare Email Routing for how PA/NJ alerts currently arrive.

# Optional secret protecting the HTTP webhook path from anyone but your
# own email provider's inbound-parse callback:
# Set with: wrangler secret put INGEST_TOKEN

# Forward a copy of every parsed alert to Ted's real inbox so nothing is
# silently swallowed and he keeps seeing these exactly as before, no new
# address to check separately.
[vars]
FORWARD_TO = "tscholl@termac.com"

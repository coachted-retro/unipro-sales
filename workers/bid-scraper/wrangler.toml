name = "bid-scraper"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

# KV namespace for NJSTART and PA eMarketplace sources (populated by the
# bid-alert-parser Worker from PA/NJ alert emails, not a live fetch on
# every request). Created 2026-07-14. Without this bound, those two
# sources gracefully return empty results with a note instead of failing
# the whole request -- every other source (PHLContracts, DC OCP, Maryland
# eMMA, Delaware, SEPTA) works without it.
[[kv_namespaces]]
binding = "BID_ALERTS"
id = "d8e7120cdcbf4999bafe274e1e28fefc"

# Optional: SAM.gov federal source needs a free API key (register at
# https://sam.gov/data-services). Without it, SAM.gov results are simply
# skipped -- every other source still works.
# Set with: wrangler secret put SAM_API_KEY

name = "termac-booking-api"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[vars]
D1_API_URL = "https://unipro-ai-proxy.termac-one.workers.dev"

[[services]]
binding = "D1_SERVICE"
service = "unipro-ai-proxy"

# Added 2026-07-14 per Ted -- notifyRep() in index.js was calling
# termac-notify's public workers.dev URL directly, which Cloudflare
# blocks worker-to-worker (error 1042, not JSON), the exact same failure
# already found and fixed once before on unipro-ai-proxy's scheduled
# reports. That means every hot lead notification from a Digital Business
# Card booking has been silently failing since this worker went live.
# This binding, paired with the code fix in index.js, is what actually
# makes that notification path work.
[[services]]
binding = "NOTIFY_SERVICE"
service = "termac-notify"

# Secret (set via the Cloudflare dashboard, never committed here):
#   D1_API_SECRET — must match the API_SECRET configured on unipro-ai-proxy
#   (standard platform value: termac2026)

# NOTE 2026-07-10: D1_API_URL above is kept only as a reference value, it
# is no longer used to build the actual request. All calls to
# unipro-ai-proxy go through the D1_SERVICE service binding (worker-to-
# worker), not a public fetch, because Cloudflare blocks a Worker from
# fetch()-ing another Worker's public *.workers.dev URL directly (error
# 1042). The service binding above must also exist in the Cloudflare
# dashboard under this worker's Settings -> Bindings, or Wrangler deploys
# from GitHub Actions will silently drop it.

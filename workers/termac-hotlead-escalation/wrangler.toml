name = "termac-hotlead-escalation"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

# Secret (set via the Cloudflare dashboard after this deploys, never
# committed here):
#   D1_API_SECRET — must match the API_SECRET configured on unipro-ai-proxy
#   (standard platform value: termac2026)

# Service bindings needed here — set BOTH in the Cloudflare dashboard
# under this worker's Settings -> Bindings, since Cloudflare blocks a
# Worker from fetch()-ing another Worker's public *.workers.dev URL
# directly (error 1042, not JSON). See index.js for details.
[[services]]
binding = "D1_SERVICE"
service = "unipro-ai-proxy"

[[services]]
binding = "NOTIFY_SERVICE"
service = "termac-notify"

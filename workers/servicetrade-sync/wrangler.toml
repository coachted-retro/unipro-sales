name = "servicetrade-sync"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[triggers]
crons = ["0 5 * * *"]  # 1am ET nightly, same slot as other overnight syncs

[[d1_databases]]
binding = "DB"
database_name = "termac-crm"
database_id = "3ea2282d-e655-477b-9d5e-560be2a1b40b"

# 2026-07-16, per Ted: account moved onto Workers Paid specifically to
# unblock this sync. Free plan caps Cron Trigger CPU time at 10ms, which
# is not enough to do a single D1 write, let alone 100 chained batches --
# every prior nightly run almost certainly died on the first batch and
# got silently swallowed by scheduled()'s catch block (now fixed to log
# instead, see index.js). Setting these explicitly rather than relying on
# plan defaults.
[limits]
cpu_ms = 300_000
subrequests = 10_000

# Set both with:
#   wrangler secret put SERVICETRADE_CLIENT_ID
#   wrangler secret put SERVICETRADE_CLIENT_SECRET
# These are the credentials from ServiceTrade's own "Add an External
# System" flow (Account -> Integrations), generated 2026-07-14. Never
# committed here in plaintext -- Cloudflare Secrets only, same pattern
# as SAM_API_KEY on bid-scraper.

name = "servicetrade-sync"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[triggers]
crons = ["0 5 * * *"]  # 1am ET nightly, same slot as other overnight syncs

[[d1_databases]]
binding = "DB"
database_name = "termac-crm"
database_id = "3ea2282d-e655-477b-9d5e-560be2a1b40b"

# Set both with:
#   wrangler secret put SERVICETRADE_CLIENT_ID
#   wrangler secret put SERVICETRADE_CLIENT_SECRET
# These are the credentials from ServiceTrade's own "Add an External
# System" flow (Account -> Integrations), generated 2026-07-14. Never
# committed here in plaintext -- Cloudflare Secrets only, same pattern
# as SAM_API_KEY on bid-scraper.

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="manifest-main.json">
<link rel="apple-touch-icon" href="icons/icon-main-apple-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-main-32.png">
<meta name="theme-color" content="#1A1D21">
<title>Division Dashboard — Termac One</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F2;--panel:#FFF;--ink:#1A1D21;--soft:#5A616B;--line:#D7DBE0;
  --red:#C8102E;--yellow:#F2B705;--green:#1E7B3C;--blue:#1B5FA8;--orange:#D8690B;
  --gray:#6B7280;--radius:10px;--shadow:0 1px 3px rgba(26,29,33,.08),0 4px 14px rgba(26,29,33,.06)
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
@media(max-width:768px){ input,textarea,select{font-size:16px!important} }
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:800}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar a{color:var(--soft);font-size:13px;text-decoration:none;font-weight:600}
.topbar a:hover{color:var(--ink)}
.gm-header{background:var(--ink);color:#fff;border-radius:var(--radius);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.gm-header h1{font-size:26px;color:#fff}
.gm-header .sub{color:#B8BEC6;font-size:13px;margin-top:3px}
.gm-avatar{width:52px;height:52px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.gm-name-block{display:flex;align-items:center;gap:12px}
.gm-name-block .who b{display:block;font-size:15px}
.gm-name-block .who span{font-size:12px;color:#B8BEC6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:none}
.stat-row .lbl{font-size:13px;color:var(--soft)}
.stat-row .val{font-size:17px;font-weight:800;font-family:'Barlow Condensed',sans-serif}
.big-stat{font-size:34px;font-weight:800;font-family:'Barlow Condensed',sans-serif;line-height:1}
.big-stat + .cap{font-size:12px;color:var(--soft);margin-top:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill-green{background:#E9F7EE;color:var(--green)}
.pill-yellow{background:#FEF6DD;color:#8A6A02}
.pill-red{background:#FDEAEC;color:var(--red)}
.pill-gray{background:#F1F2F4;color:var(--soft)}
.section-title{font-size:20px;margin:26px 0 12px}
.linkrow{display:flex;flex-wrap:wrap;gap:10px}
.linkbtn{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:7px}
.linkbtn:hover{border-color:var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--soft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:flex-end}
.form-row label{display:block;font-size:11px;color:var(--soft);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.form-row input{padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:13px}
.btn{background:var(--red);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.9}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.note{font-size:12px;color:var(--soft);font-style:italic;margin-top:8px}
.empty{color:var(--soft);font-size:13px;padding:10px 0}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}
.picker-tile{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:24px;text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.picker-tile:hover{border-color:var(--red)}
.picker-tile .ic{font-size:34px;margin-bottom:8px}
.picker-tile h3{font-size:17px;margin:0;color:var(--ink)}
.picker-tile .gm{font-size:12px;color:var(--soft);margin-top:4px}
.status-msg{padding:8px 12px;border-radius:7px;font-size:12px;font-weight:600;display:none;margin-top:10px}
#loadingBanner{max-width:1180px;margin:40px auto;text-align:center;color:var(--soft)}
</style>
</head>
<body>

<div id="loadingBanner" class="wrap">Loading division dashboard…</div>
<div id="app" class="wrap" style="display:none"></div>

<script>
// ══════════════════════════════════════════════════════════════════════
// GM / DIVISION HEAD DASHBOARD — shared single-file engine.
// URL: gm-dashboard.html?division=unipro|allpro|quality3|filterman|gto|termac
// No division param -> shows the division picker.
//
// Data model notes (2026-07-12):
// - accounts/opportunities/bids/jobs all have a real `division` column,
//   values match DIVISIONS[].real below exactly (case-sensitive).
// - deficiencies has NO division column -- it links to accounts via
//   acct_id, so division filtering goes through a join (POST /db/query).
// - Only AllPro (allpro_projects + allpro_cost_lines) has real job-level
//   sale price / actual cost data today. Every other division only has
//   pipeline estimates (opportunities.value, bids.amount) -- there is no
//   completed-job revenue/cost capture yet (NetSuite/Adagio not live).
//   Per Ted (2026-07-12): show pipeline-projected revenue for those
//   divisions PLUS a manual monthly actuals entry GMs fill in themselves,
//   clearly labeled as manual/projected, never presented as if it were
//   a live accounting feed.
// - Team roster reads the hr_data D1 table (hr_key='termac_hr_users'),
//   the same blob hr-manager-v3.html's hrSave() pushes to. If that
//   table is empty (roster never saved from HR Manager since the D1
//   push was added), this shows an honest empty state rather than a
//   hardcoded duplicate roster that could drift out of sync.
// ══════════════════════════════════════════════════════════════════════

const D1_API_URL = 'https://unipro-ai-proxy.termac-one.workers.dev';
const D1_API_SECRET = 'termac2026';

async function d1Fetch(method, path, body) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json', 'X-API-Secret': D1_API_SECRET } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(D1_API_URL + path, opts);
    return await res.json();
  } catch (e) { return { ok: false, error: e.message }; }
}
async function d1Query(sql, params) {
  return d1Fetch('POST', '/db/query', { sql, params: params || [] });
}

const DIVISIONS = {
  unipro:     { real:'UniPro',      label:'UniPro Fire Protection',    icon:'🧯', gm:'Paul Brahan',  gmEmail:'pbrahan@termac.com', color:'#C8102E' },
  allpro:     { real:'AllPro',      label:'AllPro Kitchen Exhaust',    icon:'🏗️', gm:'Dan Soleau',   gmEmail:'dsoleau@termac.com', color:'#065F46', isAllPro:true },
  quality3:   { real:'Quality III', label:'Quality III',               icon:'✅', gm:null,           gmEmail:null, color:'#1B5FA8' },
  filterman:  { real:'Filter Man',  label:'Filter Man',                icon:'🌀', gm:null,           gmEmail:null, color:'#D8690B' },
  gto:        { real:'GTO',         label:'GTO Grease Trap',           icon:'🛢️', gm:null,           gmEmail:null, color:'#0D7490' },
  termac:     { real:'Termac',      label:'Termac Dish & Chemical',    icon:'🍽️', gm:null,           gmEmail:null, color:'#6D28D9' },
};

function fmt$(n){ n = Number(n)||0; return '$' + n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function thisMonthStr(){ return new Date().toISOString().slice(0,7); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const STAFF_AUTH_API = 'https://termac-staff-auth.termac-one.workers.dev';
// role 'owner' or 'admin' = company-wide, sees every division.
// role 'manager' or 'employee' = locked to their own division only, per
// Ted (2026-07-12): GMs should not be able to browse into each other's
// dashboards.
const REVERSE_DIVISION_SLUG = {};
Object.keys(DIVISIONS).forEach(function(k){ REVERSE_DIVISION_SLUG[DIVISIONS[k].real] = k; });

async function checkAccess(){
  const raw = localStorage.getItem('termac_staff_session');
  if (!raw) {
    sessionStorage.setItem('termac_staff_return_to', location.href);
    location.href = 'staff-login.html';
    return null;
  }
  let session;
  try { session = JSON.parse(raw); } catch(e) { location.href = 'staff-login.html'; return null; }

  const res = await fetch(STAFF_AUTH_API + '/my-access?email=' + encodeURIComponent(session.email));
  const data = await res.json();
  if (!data.ok || !data.active || !(data.portals||[]).includes('gm_dashboard')) {
    showUnauthorized(session.name);
    return null;
  }
  return {
    name: session.name,
    division: data.division || '',
    ownSlug: REVERSE_DIVISION_SLUG[data.division] || null,
    elevated: data.role === 'owner' || data.role === 'admin',
  };
}

function showUnauthorized(name){
  document.getElementById('loadingBanner').style.display='none';
  const app = document.getElementById('app');
  app.style.display='block';
  app.innerHTML = `
    <div class="wrap" style="max-width:520px;margin:60px auto;text-align:center">
      <div style="font-size:40px;margin-bottom:10px">🔒</div>
      <h2 style="font-size:20px;margin-bottom:8px">Not authorized</h2>
      <p style="color:var(--soft);font-size:13px;line-height:1.6">${esc(name||'This account')} doesn't have GM Dashboard access. Ask an admin to grant it from HR Manager → Directory → Share App.</p>
      <a href="termac-os.html" style="display:inline-block;margin-top:16px;color:var(--red);font-weight:700;text-decoration:none;font-size:13px">← Back to Manager Dashboard</a>
    </div>
  `;
}

const qs = new URLSearchParams(location.search);
const slug = qs.get('division');

checkAccess().then(function(access){
  if (!access) return; // checkAccess already redirected or showed unauthorized

  if (!access.elevated) {
    // Locked to their own division. No slug -> send them straight there
    // (no point showing a picker with one option). Wrong slug -> same,
    // rather than silently rendering someone else's numbers.
    if (!access.ownSlug) { showUnauthorized(access.name); return; }
    if (slug !== access.ownSlug) { location.href = 'gm-dashboard.html?division=' + access.ownSlug; return; }
    renderDashboard(slug, DIVISIONS[slug], access.elevated);
    return;
  }

  // Elevated (owner/admin): full picker + any division on request, same
  // as before.
  if (!slug || !DIVISIONS[slug]) {
    renderPicker();
  } else {
    renderDashboard(slug, DIVISIONS[slug], access.elevated);
  }
});

function renderPicker(){
  document.getElementById('loadingBanner').style.display='none';
  const app = document.getElementById('app');
  app.style.display='block';
  app.innerHTML = `
    <div class="topbar"><a href="termac-os.html">← Manager Dashboard</a></div>
    <div class="gm-header"><div><h1>Division Dashboards</h1><div class="sub">Select a division to open its GM / Department Head view</div></div></div>
    <div class="picker-grid">
      ${Object.entries(DIVISIONS).map(([key,d])=>`
        <a class="picker-tile" href="gm-dashboard.html?division=${key}">
          <div class="ic">${d.icon}</div>
          <h3>${esc(d.label)}</h3>
          <div class="gm">${d.gm ? esc(d.gm) : 'GM — pending roster'}</div>
        </a>
      `).join('')}
    </div>
  `;
}

async function renderDashboard(slug, div, elevated){
  const app = document.getElementById('app');
  const loading = document.getElementById('loadingBanner');

  // route-debrief.html's division dropdown uses different raw strings
  // than this file's clean division slugs (one combined "UniPro /
  // Quality III" option, two Termac options) -- this maps each GM
  // dashboard slug to every raw debrief-form value that should count
  // toward it. "UniPro / Quality III" deliberately appears under both,
  // since the form itself doesn't disambiguate which tech was covering
  // which side of that combined option.
  const DEBRIEF_FORM_DIVISIONS = {
    unipro: ['UniPro / Quality III'], quality3: ['UniPro / Quality III'],
    allpro: ['AllPro'], gto: ['GTO'], filterman: ['Filter Man'],
    termac: ['Termac Service', 'Termac Driver'],
  };
  const debriefDivisionValues = DEBRIEF_FORM_DIVISIONS[slug] || [];
  const debriefPlaceholders = debriefDivisionValues.map(() => '?').join(',');

  // Fire every data fetch in parallel -- independent panels, no reason
  // to wait on each other, and one failing shouldn't block the rest.
  const [
    accountsRes, oppsRes, bidsRes, jobsTodayRes, deficienciesRes,
    actualsRes, allproRes, hrRes, debriefsRes
  ] = await Promise.all([
    d1Fetch('GET', `/db/accounts?division=${encodeURIComponent(div.real)}&limit=500`),
    d1Fetch('GET', `/db/opportunities?division=${encodeURIComponent(div.real)}&limit=500`),
    d1Fetch('GET', `/db/bids?division=${encodeURIComponent(div.real)}&limit=500`),
    d1Query('SELECT status, COUNT(*) as n FROM jobs WHERE division = ? AND scheduled_date = ? GROUP BY status', [div.real, todayStr()]),
    d1Query('SELECT d.status as status, COUNT(*) as n FROM deficiencies d JOIN accounts a ON a.id = d.acct_id WHERE a.division = ? GROUP BY d.status', [div.real]),
    d1Fetch('GET', `/db/division_actuals?division=${encodeURIComponent(div.real)}&limit=24`),
    div.isAllPro ? d1Query('SELECT stage, COUNT(*) as n, SUM(sale_price) as sale, SUM(actual_cost) as cost FROM allpro_projects GROUP BY stage') : Promise.resolve(null),
    d1Fetch('GET', '/db/hr_data?hr_key=termac_hr_users&limit=1'),
    debriefDivisionValues.length
      ? d1Query(`SELECT * FROM debriefs WHERE division IN (${debriefPlaceholders}) ORDER BY submitted_at DESC LIMIT 20`, debriefDivisionValues)
      : Promise.resolve({ ok: true, results: [] }),
  ]);

  loading.style.display='none';
  app.style.display='block';

  const accounts = accountsRes.ok ? accountsRes.results : [];
  const opps = oppsRes.ok ? oppsRes.results : [];
  const bids = bidsRes.ok ? bidsRes.results : [];
  const jobsToday = jobsTodayRes.ok ? jobsTodayRes.results : [];
  const deficiencies = deficienciesRes.ok ? deficienciesRes.results : [];
  const actuals = (actualsRes.ok ? actualsRes.results : []).sort((a,b)=> b.month.localeCompare(a.month));
  const allproStages = allproRes && allproRes.ok ? allproRes.results : null;
  const debriefs = debriefsRes && debriefsRes.ok ? debriefsRes.results : [];

  let team = [];
  if (hrRes.ok && hrRes.results && hrRes.results[0]) {
    try { team = (JSON.parse(hrRes.results[0].data_json)||[]).filter(u => u.division === div.real); } catch(e){}
  }

  const openOpps = opps.filter(o => !['won','lost','closed'].includes((o.stage||'').toLowerCase()));
  const openBids = bids.filter(b => !['won','lost','closed','expired'].includes((b.status||'').toLowerCase()));
  const pipelineValue = openOpps.reduce((s,o)=>s+(Number(o.value)||0),0) + openBids.reduce((s,b)=>s+(Number(b.amount)||0),0);

  const jobsDoneToday = jobsToday.filter(j=>j.status==='completed').reduce((s,j)=>s+j.n,0);
  const jobsScheduledToday = jobsToday.reduce((s,j)=>s+j.n,0);

  const defOpen = deficiencies.filter(d=>d.status!=='resolved').reduce((s,d)=>s+d.n,0);
  const defTotal = deficiencies.reduce((s,d)=>s+d.n,0);

  let allproBlock = '';
  if (div.isAllPro) {
    const totals = (allproStages||[]).reduce((acc,r)=>{ acc.sale += Number(r.sale)||0; acc.cost += Number(r.cost)||0; return acc; }, {sale:0,cost:0});
    const margin = totals.sale - totals.cost;
    const marginPct = totals.sale ? (margin/totals.sale*100).toFixed(1) : '—';
    allproBlock = `
      <div class="card" style="grid-column:1/-1;border-left:4px solid ${div.color}">
        <h3>AllPro Real Job Margin — live from cost lines</h3>
        <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:0">
          <div><div class="big-stat">${fmt$(totals.sale)}</div><div class="cap">Total sale price, all projects</div></div>
          <div><div class="big-stat">${fmt$(totals.cost)}</div><div class="cap">Total actual cost</div></div>
          <div><div class="big-stat" style="color:${margin>=0?'var(--green)':'var(--red)'}">${fmt$(margin)}</div><div class="cap">Real margin (${marginPct}%)</div></div>
        </div>
        <table style="margin-top:14px">
          <tr><th>Stage</th><th>Projects</th><th>Sale Price</th><th>Actual Cost</th></tr>
          ${(allproStages||[]).map(r=>`<tr><td>${esc(r.stage||'—')}</td><td>${r.n}</td><td>${fmt$(r.sale)}</td><td>${fmt$(r.cost)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No AllPro projects yet.</td></tr>'}
        </table>
        <div class="linkrow" style="margin-top:14px">
          <a class="linkbtn" href="allpro-project-planner.html">🏗️ Open AllPro Project Planner</a>
        </div>
      </div>`;
  }

  // Route Debriefs, moved here 2026-07-13 per Ted -- this is where the
  // real per-tech detail belongs now, not the general Manager Dashboard
  // (which just shows a company-wide count linking here). Real intel/
  // complaint fields only, no fabricated jobs/revenue numbers the actual
  // submission form never collects.
  const debriefsBlock = `
    <div class="card" style="grid-column:1/-1">
      <h3>🌙 Route Debriefs — last 20</h3>
      ${debriefs.length ? debriefs.map(d => `
        <div style="background:#F9FAFB;border-radius:7px;padding:10px 12px;margin-bottom:8px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="font-weight:700;font-size:13px">${esc(d.tech||'Unknown')}</div>
            <div style="font-size:11px;color:var(--soft)">${d.submitted_at ? new Date(d.submitted_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : ''}</div>
          </div>
          <div style="font-size:12px;color:#374151;margin-top:3px">Shift ${esc(d.shift_start||'?')}–${esc(d.shift_end||'?')} · Truck ${esc(d.truck||'—')} · Rating: ${d.shift_rating ? '⭐'.repeat(d.shift_rating) : '—'}</div>
          ${d.sales_leads_discovered ? `<div style="font-size:12px;color:#1E7B3C;margin-top:3px">💡 Intel: ${esc(String(d.sales_leads_discovered).slice(0,140))}</div>` : ''}
          ${d.customer_complaints ? `<div style="font-size:12px;color:#C8102E;margin-top:3px">⚠️ Complaint: ${esc(String(d.customer_complaints).slice(0,140))}</div>` : ''}
          ${d.blockers ? `<div style="font-size:12px;color:#92400E;margin-top:3px">🚧 Blocker: ${esc(String(d.blockers).slice(0,140))}</div>` : ''}
        </div>`).join('') : '<div class="empty">No debriefs submitted yet for this division.</div>'}
    </div>`;

  app.innerHTML = `
    <div class="topbar">
      ${elevated ? '<a href="gm-dashboard.html">← All Divisions</a>' : '<span></span>'}
      <a href="termac-os.html">Manager Dashboard</a>
    </div>
    <div class="gm-header" style="border-left:6px solid ${div.color}">
      <div><h1>${div.icon} ${esc(div.label)}</h1><div class="sub">Division dashboard · ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div></div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        ${div.isAllPro ? '<a href="allpro-project-planner.html" style="background:#F2B705;color:#1A1D21;border:none;border-radius:8px;padding:11px 18px;font-family:\'Barlow Condensed\',sans-serif;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;white-space:nowrap">🏗️ Open AllPro Project Planner</a>' : ''}
        <div class="gm-name-block">
          <div class="gm-avatar" style="background:${div.color}">${div.gm ? div.gm.split(' ').map(w=>w[0]).join('') : '—'}</div>
          <div class="who"><b>${div.gm ? esc(div.gm) : 'GM — TBD'}</b><span>${div.gm ? 'Division GM · '+esc(div.gmEmail) : 'Pending staff roster'}</span></div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>Today's Field Snapshot</h3>
        <div class="big-stat">${jobsScheduledToday}</div><div class="cap">Jobs scheduled today</div>
        <div class="stat-row" style="margin-top:10px"><span class="lbl">Completed</span><span class="val" style="color:var(--green)">${jobsDoneToday}</span></div>
        <div class="stat-row"><span class="lbl">Remaining / other status</span><span class="val">${jobsScheduledToday-jobsDoneToday}</span></div>
      </div>

      <div class="card">
        <h3>Pipeline</h3>
        <div class="big-stat">${fmt$(pipelineValue)}</div><div class="cap">Open opportunities + bids (projected)</div>
        <div class="stat-row" style="margin-top:10px"><span class="lbl">Open opportunities</span><span class="val">${openOpps.length}</span></div>
        <div class="stat-row"><span class="lbl">Open bids</span><span class="val">${openBids.length}</span></div>
      </div>

      <div class="card">
        <h3>Accounts</h3>
        <div class="big-stat">${accounts.length}</div><div class="cap">Active accounts in this division</div>
      </div>

      <div class="card">
        <h3>Deficiency Backlog</h3>
        <div class="big-stat" style="color:${defOpen>0?'var(--red)':'var(--green)'}">${defOpen}</div><div class="cap">Open of ${defTotal} total</div>
        <div class="note">From Lexi's Deficiency Command Center, filtered to this division's accounts.</div>
      </div>
    </div>

    <h2 class="section-title">P&amp;L</h2>
    <div class="grid">
      <div class="card">
        <h3>Pipeline-Projected Revenue</h3>
        <div class="big-stat">${fmt$(pipelineValue)}</div>
        <div class="cap">Sum of open opportunity + bid values — this is a projection from the pipeline, not booked revenue.</div>
      </div>
      <div class="card" style="grid-column:span 2">
        <h3>Manual Monthly Actuals</h3>
        <div class="note" style="margin-top:0;margin-bottom:10px">Enter each month's real revenue and cost until NetSuite/Adagio is live. Saved per division, one entry per month.</div>
        <table>
          <tr><th>Month</th><th>Revenue</th><th>Cost</th><th>Margin</th><th>Notes</th></tr>
          ${actuals.length ? actuals.map(a=>{
            const m = (Number(a.revenue)||0)-(Number(a.cost)||0);
            return `<tr><td>${esc(a.month)}</td><td>${fmt$(a.revenue)}</td><td>${fmt$(a.cost)}</td><td style="color:${m>=0?'var(--green)':'var(--red)'}">${fmt$(m)}</td><td>${esc(a.notes||'')}</td></tr>`;
          }).join('') : '<tr><td colspan="5" class="empty">No actuals entered yet.</td></tr>'}
        </table>
        <div class="form-row">
          <div><label>Month</label><input type="month" id="actMonth" value="${thisMonthStr()}"></div>
          <div><label>Revenue</label><input type="number" id="actRevenue" placeholder="0" style="width:120px"></div>
          <div><label>Cost</label><input type="number" id="actCost" placeholder="0" style="width:120px"></div>
          <div style="flex:1;min-width:160px"><label>Notes</label><input type="text" id="actNotes" placeholder="Optional"></div>
          <button class="btn" onclick="saveActual('${slug}')">Save Month</button>
        </div>
        <div id="actualStatus" class="status-msg"></div>
      </div>
    </div>

    <div class="grid">${allproBlock}</div>

    <h2 class="section-title">Field</h2>
    <div class="grid">${debriefsBlock}</div>

    <h2 class="section-title">Team</h2>
    <div class="card">
      ${team.length ? `
        <div class="big-stat">${team.length}</div><div class="cap">People assigned to ${esc(div.real)}</div>
        <table style="margin-top:14px">
          <tr><th>Name</th><th>Title</th><th>Email</th></tr>
          ${team.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.title||'')}</td><td>${esc(t.email||'')}</td></tr>`).join('')}
        </table>
      ` : `<div class="empty">Team roster not yet available for this division.</div>`}
    </div>

    <h2 class="section-title">Quick Links</h2>
    <div class="linkrow">
      <a class="linkbtn" href="scheduler-v2.html">📅 Scheduler</a>
      <a class="linkbtn" href="dispatch-v2.html">🚚 Dispatch</a>
      <a class="linkbtn" href="deficiency-portal.html">🛠️ Deficiency Portal</a>
      <a class="linkbtn" href="warehouse-portal.html">📦 Warehouse</a>
      <a class="linkbtn" href="my-hr.html">🪪 My HR</a>
    </div>
  `;
}

async function saveActual(slug){
  const div = DIVISIONS[slug];
  const month = document.getElementById('actMonth').value;
  const revenue = parseFloat(document.getElementById('actRevenue').value) || 0;
  const cost = parseFloat(document.getElementById('actCost').value) || 0;
  const notes = document.getElementById('actNotes').value.trim();
  const statusEl = document.getElementById('actualStatus');
  if (!month) { alert('Pick a month.'); return; }

  statusEl.style.display='block'; statusEl.style.background='#F1F2F4'; statusEl.style.color='var(--soft)';
  statusEl.textContent = 'Saving…';

  // One row per division+month -- look up an existing row for this
  // month first so re-saving the same month updates it instead of
  // creating a duplicate (the DB has a unique index on division+month
  // as a backstop, but we still want a clean PUT when one exists).
  const existing = await d1Fetch('GET', `/db/division_actuals?division=${encodeURIComponent(div.real)}&month=${encodeURIComponent(month)}`);
  const row = { division: div.real, month, revenue, cost, notes, entered_by: 'GM Dashboard' };

  let res;
  if (existing.ok && existing.results && existing.results[0]) {
    res = await d1Fetch('PUT', `/db/division_actuals/${existing.results[0].id}`, row);
  } else {
    res = await d1Fetch('POST', '/db/division_actuals', row);
  }

  if (res.ok) {
    statusEl.style.background='#E9F7EE'; statusEl.style.color='var(--green)';
    statusEl.textContent = '✓ Saved. Reloading…';
    setTimeout(()=>location.reload(), 700);
  } else {
    statusEl.style.background='#FDEAEC'; statusEl.style.color='var(--red)';
    statusEl.textContent = res.error || 'Could not save — try again.';
  }
}
</script>

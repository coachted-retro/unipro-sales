<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termac One — Sandbox Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EEF0F2;--ink:#1A1D21;--soft:#5A616B;--line:#D7DBE0;--red:#C8102E;--blue:#1B5FA8;--green:#1E7B3C;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#1A1D21,#0D0F12);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Barlow',sans-serif;}
.card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(440px,100%);padding:32px 28px}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:.08em;text-align:center;color:var(--ink);margin-bottom:2px}
.sub{text-align:center;font-size:11px;color:#C8102E;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:24px}
.name-btn{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:9px;background:#F9FAFB;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em;text-align:left;cursor:pointer;margin-bottom:8px;color:var(--ink);display:flex;align-items:center;gap:10px;transition:background .15s,border-color .15s}
.name-btn:hover{background:#EFF6FF;border-color:#1B5FA8}
.role{font-size:11px;font-weight:600;color:var(--soft);margin-left:auto;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<div class="card">
  <div class="logo">TERMAC ONE</div>
  <div class="sub">Sandbox — No Microsoft Required</div>
  <div id="picker"></div>
</div>
<script>
var STAFF = [
  {name:'Ted Scholl',    email:'tscholl@termac.com',    role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'Tom Pittakas',  email:'tpittakas@termac.com',  role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'TJ O\'Reilly',  email:'tjoreilly@termac.com',  role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'Joe McDonnell', email:'jmcdonnell@termac.com', role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'Matt Belz',     email:'mbelz@termac.com',      role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'Dan Rini',      email:'drini@termac.com',      role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'Todd Grill',    email:'tgrill@termac.com',     role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'Brad Fickes',   email:'bfickes@termac.com',    role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'Tom Jordan',    email:'tjordan@termac.com',    role:'Sales Rep',    portal:'rep-portal.html'},
  {name:'Jim Kennedy',   email:'jkennedy@termac.com',   role:'Manager',      portal:'termac-os.html'},
  {name:'Paul Brahan',   email:'pbrahan@termac.com',    role:'GM',           portal:'termac-os.html'},
  {name:'Kate Clark',    email:'kclark@termac.com',     role:'Reception',    portal:'reception-portal.html'},
  {name:'Dan Soleau',    email:'dsoleau@termac.com',    role:'AllPro GM',    portal:'gm-dashboard.html'},
];

var picker = document.getElementById('picker');
STAFF.forEach(function(s) {
  var btn = document.createElement('button');
  btn.className = 'name-btn';
  btn.innerHTML = '<span>' + s.name + '</span><span class="role">' + s.role + '</span>';
  btn.onclick = function() {
    var session = {
      name: s.name,
      email: s.email,
      role: s.role,
      active: true,
      portals: ['sales_rep','manager','reception','gm','admin'],
      loggedInAt: Date.now()
    };
    localStorage.setItem('termac_staff_session', JSON.stringify(session));
    localStorage.setItem('termac_current_user', JSON.stringify(session));
    window.location.href = s.portal;
  };
  picker.appendChild(btn);
});
</script>
</body>
</html>

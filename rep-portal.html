<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termac One — Rep Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--red:#C8102E;--blue:#1B5FA8;--green:#1E7B3C;--ink:#1A1D21;--soft:#5A616B;--line:#D7DBE0;--bg:#EEF0F2;--card:#fff;--orange:#D8690B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Barlow',sans-serif;color:var(--ink);min-height:100vh;}
/* NAV */
.nav{background:#1A1D21;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:#fff;letter-spacing:.08em;}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-rep{font-size:12px;color:#9CA3AF;font-weight:600;}
.nav-signout{background:var(--red);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:.05em;cursor:pointer;}
/* SEARCH */
.search-bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:53px;z-index:99;}
.search-input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:9px;font-family:'Barlow',sans-serif;font-size:15px;color:var(--ink);outline:none;}
.search-input:focus{border-color:var(--blue);}
.search-results{background:#fff;border:1.5px solid var(--blue);border-top:none;border-radius:0 0 9px 9px;max-height:280px;overflow-y:auto;display:none;}
.search-row{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px;}
.search-row:hover{background:#EFF6FF;}
.search-row b{display:block;font-weight:700;color:var(--ink);}
.search-row span{font-size:12px;color:var(--soft);}
/* MAIN */
.main{padding:14px 14px 80px;}
.section-label{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:16px 0 8px;}
/* AGENDA CARD */
.agenda-card{background:var(--card);border-radius:10px;border-left:4px solid var(--blue);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.agenda-time{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--blue);min-width:52px;}
.agenda-body{flex:1;min-width:0;}
.agenda-title{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.agenda-addr{font-size:12px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.agenda-nav{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;}
/* LOCATION CARD */
.loc-card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.loc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.loc-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;color:var(--ink);}
.loc-status{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:3px 7px;}
.status-lead{background:#FEF3C7;color:#92400E;}
.status-active{background:#D1FAE5;color:#065F46;}
.status-prospect{background:#DBEAFE;color:#1E40AF;}
.loc-addr{font-size:13px;color:var(--soft);margin-bottom:10px;}
.loc-actions{display:flex;gap:7px;flex-wrap:wrap;}
.btn{border:none;border-radius:7px;padding:9px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;}
.btn-primary{background:var(--red);color:#fff;flex:1;}
.btn-secondary{background:#F3F4F6;color:var(--ink);}
.btn-green{background:var(--green);color:#fff;}
.btn-call{background:#F3F4F6;color:var(--ink);}
/* HOT LEAD BADGE */
.hot-badge{background:var(--red);color:#fff;border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.hot-badge-icon{font-size:20px;}
.hot-badge-body{flex:1;}
.hot-badge-name{font-weight:700;font-size:14px;}
.hot-badge-sub{font-size:12px;opacity:.85;margin-top:2px;}
.hot-badge-btn{background:#fff;color:var(--red);border:none;border-radius:6px;padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;}
/* APPT MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:480px;padding:24px 20px 32px;}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;margin-bottom:16px;color:var(--ink);}
.form-group{margin-bottom:14px;}
.form-label{font-size:12px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px;}
.form-input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:'Barlow',sans-serif;font-size:15px;color:var(--ink);}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.time-btn{padding:10px 4px;border:1.5px solid var(--line);border-radius:7px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;background:#fff;cursor:pointer;text-align:center;}
.time-btn.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
.modal-actions{display:flex;gap:8px;margin-top:18px;}
.empty-state{text-align:center;padding:32px 20px;color:var(--soft);font-size:14px;}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">🔴 TERMAC ONE</div>
  <div class="nav-right">
    <div class="nav-rep" id="navRep">Loading...</div>
    <button class="nav-signout" onclick="signOut()">Sign Out</button>
  </div>
</div>

<div class="search-bar">
  <input class="search-input" id="searchInput" placeholder="Search locations, businesses, addresses..." oninput="onSearch(this.value)" onblur="setTimeout(()=>document.getElementById('searchResults').style.display='none',200)">
  <div class="search-results" id="searchResults"></div>
</div>

<div class="main">
  <div id="hotLeads"></div>
  <div class="section-label">Today's Agenda</div>
  <div id="agendaList"></div>
  <div class="section-label">My Locations</div>
  <div id="locationList"></div>
</div>

<!-- Appointment Modal -->
<div class="modal-bg" id="apptModal" style="display:none">
  <div class="modal">
    <div class="modal-title" id="apptModalTitle">Set Appointment</div>
    <div class="form-group">
      <label class="form-label">Date</label>
      <input class="form-input" type="date" id="apptDate">
    </div>
    <div class="form-group">
      <label class="form-label">Time</label>
      <div class="time-grid" id="timeGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <input class="form-input" type="text" id="apptNotes" placeholder="What is this appointment for?">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1" onclick="closeApptModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveAppt()">Save Appointment</button>
    </div>
  </div>
</div>

<script>
var D1 = 'https://unipro-ai-proxy.termac-one.workers.dev';
var SECRET = 'termac2026';
var _rep = null;
var _apptLocId = null;
var _apptLocName = null;
var _selectedTime = null;

// ── AUTH ──────────────────────────────────────────────────────────────
function getSession() {
  try { return JSON.parse(localStorage.getItem('termac_staff_session') || 'null'); } catch(e) { return null; }
}
function signOut() {
  localStorage.removeItem('termac_staff_session');
  localStorage.removeItem('termac_current_user');
  window.location.href = 'sbx-login.html';
}
function init() {
  var s = getSession();
  if (!s || !s.name) { window.location.href = 'sbx-login.html'; return; }
  _rep = s;
  document.getElementById('navRep').textContent = s.name;
  // Set today's date default on appt modal
  var today = new Date().toISOString().slice(0,10);
  document.getElementById('apptDate').value = today;
  buildTimeGrid();
  loadAll();
}

// ── D1 QUERY ─────────────────────────────────────────────────────────
function d1q(sql, params) {
  return fetch(D1 + '/db/query', {
    method: 'POST',
    headers: {'Content-Type':'application/json','X-API-Secret':SECRET},
    body: JSON.stringify({sql:sql, params:params||[]})
  }).then(function(r){return r.json();});
}

// ── LOAD ALL ─────────────────────────────────────────────────────────
function loadAll() {
  loadHotLeads();
  loadAgenda();
  loadLocations();
}

// ── HOT LEADS ────────────────────────────────────────────────────────
function loadHotLeads() {
  d1q('SELECT id, business, address, assigned_rep FROM leads WHERE assigned_rep=? AND (is_hot=1 OR ai_score>=8) ORDER BY updated DESC LIMIT 3', [_rep.name])
  .then(function(res) {
    var el = document.getElementById('hotLeads');
    if (!res.ok || !res.results || !res.results.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="section-label">🔥 Hot Leads</div>' +
      res.results.map(function(r) {
        return '<div class="hot-badge">' +
          '<div class="hot-badge-icon">🔥</div>' +
          '<div class="hot-badge-body">' +
            '<div class="hot-badge-name">' + esc(r.business||'Lead') + '</div>' +
            '<div class="hot-badge-sub">' + esc(r.address||'') + '</div>' +
          '</div>' +
          '<button class="hot-badge-btn" onclick="openApptFromLead(\'' + r.id + '\',\'' + esc(r.business) + '\')">Set Appt</button>' +
        '</div>';
      }).join('');
  });
}

// ── AGENDA ────────────────────────────────────────────────────────────
function loadAgenda() {
  var today = new Date().toISOString().slice(0,10);
  d1q('SELECT id, title, business, time, location, location_id, record_id, tab FROM appointments WHERE rep=? AND date=? ORDER BY time', [_rep.name, today])
  .then(function(res) {
    var el = document.getElementById('agendaList');
    if (!res.ok || !res.results || !res.results.length) {
      el.innerHTML = '<div class="empty-state">No appointments today.<br>Tap a location below to set one.</div>';
      return;
    }
    el.innerHTML = res.results.map(function(a) {
      var t = a.time ? fmtTime(a.time) : 'All day';
      var addr = a.location || '';
      var mapsUrl = addr ? 'https://maps.google.com/?q=' + encodeURIComponent(addr) : '#';
      return '<div class="agenda-card">' +
        '<div class="agenda-time">' + t + '</div>' +
        '<div class="agenda-body">' +
          '<div class="agenda-title">' + esc(a.title||a.business||'Appointment') + '</div>' +
          (addr ? '<div class="agenda-addr">📍 ' + esc(addr) + '</div>' : '') +
        '</div>' +
        (addr ? '<a href="' + mapsUrl + '" target="_blank"><button class="agenda-nav">Nav →</button></a>' : '') +
      '</div>';
    }).join('');
  });
}

// ── LOCATIONS ────────────────────────────────────────────────────────
function loadLocations() {
  d1q('SELECT id, name, parent_company, address, city, state, phone, status FROM locations WHERE assigned_rep=? ORDER BY updated_at DESC LIMIT 25', [_rep.name])
  .then(function(res) {
    var el = document.getElementById('locationList');
    if (!res.ok || !res.results || !res.results.length) {
      el.innerHTML = '<div class="empty-state">No locations yet. Search above to find one.</div>';
      return;
    }
    el.innerHTML = res.results.map(function(l) { return renderLocCard(l); }).join('');
  });
}

function renderLocCard(l) {
  var statusClass = l.status === 'active' ? 'status-active' : (l.status === 'prospect' ? 'status-prospect' : 'status-lead');
  var statusLabel = l.status || 'Lead';
  var addr = [l.address, l.city, l.state].filter(Boolean).join(', ');
  var phoneBtn = l.phone ? '<button class="btn btn-call" onclick="window.location.href=\'tel:' + esc(l.phone) + '\'">📞 Call</button>' : '';
  var mapsBtn = addr ? '<a href="https://maps.google.com/?q=' + encodeURIComponent(addr) + '" target="_blank"><button class="btn btn-secondary">🗺 Nav</button></a>' : '';
  return '<div class="loc-card">' +
    '<div class="loc-header">' +
      '<div>' +
        '<div class="loc-name">' + esc(l.name||'Location') + '</div>' +
        (l.parent_company && l.parent_company !== l.name ? '<div style="font-size:12px;color:var(--soft);margin-top:1px">' + esc(l.parent_company) + '</div>' : '') +
      '</div>' +
      '<span class="loc-status ' + statusClass + '">' + esc(statusLabel) + '</span>' +
    '</div>' +
    (addr ? '<div class="loc-addr">📍 ' + esc(addr) + '</div>' : '') +
    '<div class="loc-actions">' +
      '<button class="btn btn-primary" onclick="openApptModal(\'' + l.id + '\',\'' + esc(l.name) + '\')">+ Set Appointment</button>' +
      phoneBtn + mapsBtn +
    '</div>' +
  '</div>';
}

// ── SEARCH ───────────────────────────────────────────────────────────
var _searchTimer = null;
function onSearch(val) {
  clearTimeout(_searchTimer);
  var el = document.getElementById('searchResults');
  if (!val || val.length < 2) { el.style.display = 'none'; return; }
  _searchTimer = setTimeout(function() {
    var q = '%' + val + '%';
    d1q('SELECT id, name, address, city, state, phone, status FROM locations WHERE (name LIKE ? OR address LIKE ? OR city LIKE ?) LIMIT 10', [q,q,q])
    .then(function(res) {
      if (!res.ok || !res.results || !res.results.length) { el.style.display='none'; return; }
      el.innerHTML = res.results.map(function(l) {
        var addr = [l.address, l.city, l.state].filter(Boolean).join(', ');
        return '<div class="search-row" onclick="selectSearchResult(' + JSON.stringify(l) + ')">' +
          '<b>' + esc(l.name||'Location') + '</b>' +
          '<span>' + esc(addr) + '</span>' +
        '</div>';
      }).join('');
      el.style.display = 'block';
    });
  }, 220);
}
function selectSearchResult(l) {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').style.display = 'none';
  // Insert card at top of location list
  var el = document.getElementById('locationList');
  var div = document.createElement('div');
  div.innerHTML = renderLocCard(l);
  el.insertBefore(div.firstChild, el.firstChild);
}

// ── APPOINTMENT MODAL ────────────────────────────────────────────────
var TIMES = ['7:00','7:30','8:00','8:30','9:00','9:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00'];
function buildTimeGrid() {
  var grid = document.getElementById('timeGrid');
  grid.innerHTML = TIMES.map(function(t) {
    return '<button class="time-btn" onclick="selectTime(\'' + t + '\',this)">' + fmtTime(t) + '</button>';
  }).join('');
}
function selectTime(t, btn) {
  _selectedTime = t;
  document.querySelectorAll('.time-btn').forEach(function(b){ b.classList.remove('selected'); });
  btn.classList.add('selected');
}
function openApptModal(locId, locName) {
  _apptLocId = locId;
  _apptLocName = locName;
  _selectedTime = null;
  document.querySelectorAll('.time-btn').forEach(function(b){ b.classList.remove('selected'); });
  document.getElementById('apptNotes').value = '';
  document.getElementById('apptModalTitle').textContent = 'Appointment — ' + locName;
  document.getElementById('apptModal').style.display = 'flex';
}
function openApptFromLead(leadId, leadName) {
  _apptLocId = leadId;
  _apptLocName = leadName;
  _selectedTime = null;
  document.querySelectorAll('.time-btn').forEach(function(b){ b.classList.remove('selected'); });
  document.getElementById('apptNotes').value = '';
  document.getElementById('apptModalTitle').textContent = 'Appointment — ' + leadName;
  document.getElementById('apptModal').style.display = 'flex';
}
function closeApptModal() {
  document.getElementById('apptModal').style.display = 'none';
}
function saveAppt() {
  var date = document.getElementById('apptDate').value;
  var notes = document.getElementById('apptNotes').value.trim();
  if (!date) { alert('Pick a date.'); return; }
  if (!_selectedTime) { alert('Pick a time.'); return; }
  var id = 'appointment_' + Date.now();
  var payload = {
    id: id,
    title: _apptLocName,
    business: _apptLocName,
    date: date,
    time: _selectedTime,
    notes: notes,
    location_id: _apptLocId,
    record_id: _apptLocId,
    tab: 'locations',
    type: 'appointment',
    rep: _rep.name,
    created_by: _rep.name,
    division: _rep.division || '',
    status: 'scheduled',
    created_at: Date.now(),
    updated_at: Date.now()
  };
  fetch(D1 + '/db/appointments', {
    method: 'POST',
    headers: {'Content-Type':'application/json','X-API-Secret':SECRET},
    body: JSON.stringify(payload)
  }).then(function(r){return r.json();}).then(function(res) {
    if (res.ok) {
      closeApptModal();
      showToast('✅ Appointment saved — ' + fmtTime(_selectedTime) + ' on ' + date);
      loadAgenda();
    } else {
      alert('Save failed: ' + (res.error||'Unknown error'));
    }
  }).catch(function(e){ alert('Error: ' + e.message); });
}

// ── UTILS ─────────────────────────────────────────────────────────────
function fmtTime(t) {
  if (!t) return '';
  var parts = t.split(':');
  var h = parseInt(parts[0],10);
  var m = parts[1] || '00';
  var ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1D21;color:#fff;padding:12px 20px;border-radius:9px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}

init();
</script>
</body>
</html>

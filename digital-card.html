<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Termac One — Digital Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#F5F6F8;color:#1A1D21;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.card{max-width:440px;width:100%;background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.12);overflow:hidden}
.hdr{background:linear-gradient(135deg,#1A1D21,#2A2E33);padding:36px 28px 28px;text-align:center;position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:#C8102E}
.photo{width:92px;height:92px;border-radius:50%;background:#C8102E;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:32px;margin:0 auto 16px;border:3px solid rgba(255,255,255,.2)}
.name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:24px;color:#fff}
.title{color:#9CA3AF;font-size:13px;margin-top:4px}
.divisions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.div-pill{background:rgba(255,255,255,.1);color:#fff;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.body{padding:24px 28px}
.contact-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F0F1F3;text-decoration:none;color:#1A1D21}
.contact-row:last-child{border-bottom:none}
.contact-icon{width:36px;height:36px;border-radius:10px;background:#F5F6F8;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.contact-text{font-size:14px;font-weight:600}
.contact-label{font-size:11px;color:#9CA3AF;text-transform:uppercase;letter-spacing:.04em}
.linkedin-row{background:#0A66C2;color:#fff;border-radius:10px;padding:6px 12px}
.linkedin-row .contact-icon{background:rgba(255,255,255,.15)}
.linkedin-row .contact-label{color:rgba(255,255,255,.7)}
.cta{display:block;width:100%;background:#C8102E;color:#fff;border:none;border-radius:12px;padding:16px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;margin-top:20px}
.cta:hover{background:#A30D25}
.company-link{display:block;text-align:center;margin-top:16px;font-size:12px;color:#6B7280;text-decoration:none}
.company-link:hover{color:#C8102E}

/* Booking modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;z-index:1000}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px;margin-top:20px}
.modal h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;margin-bottom:4px}
.modal p.sub{font-size:13px;color:#6B7280;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#6B7280;margin-bottom:5px}
.field input, .field textarea{width:100%;padding:10px 12px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-family:inherit}
.field textarea{resize:vertical;min-height:70px}
.hp{position:absolute;left:-9999px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn-secondary{flex:1;background:#F5F6F8;color:#1A1D21;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:13px;cursor:pointer}
.btn-primary{flex:2;background:#C8102E;color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:13px;cursor:pointer}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.status-msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:12px;display:none}
.status-msg.success{background:#DCFCE7;color:#166534;display:block}
.status-msg.error{background:#FEE2E2;color:#991B1B;display:block}
.notfound{padding:60px 20px;text-align:center;color:#6B7280}
</style>
</head>
<body>

<div id="app"></div>

<div class="modal-bg" id="bookModal">
  <div class="modal">
    <h2>📅 Request an Appointment</h2>
    <p class="sub" id="modalSub">Send your info and preferred time — this goes straight to your rep.</p>
    <form id="bookForm">
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off">
      <div class="field">
        <label>Your Name *</label>
        <input type="text" id="bf_name" required maxlength="120">
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="tel" id="bf_phone" maxlength="30">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="bf_email" maxlength="200">
      </div>
      <div class="field">
        <label>Preferred Date</label>
        <input type="date" id="bf_date">
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="bf_notes" maxlength="1000" placeholder="What can we help with?"></textarea>
      </div>
      <div class="status-msg" id="bfStatus"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeBookModal()">Cancel</button>
        <button type="submit" class="btn-primary" id="bfSubmit">Send Request</button>
      </div>
    </form>
  </div>
</div>

<script>
// ── REP PROFILES ──────────────────────────────────────────────────────────
var PROFILE_API_URL = 'https://termac-booking-api.termac-one.workers.dev/profile';
var BOOKING_API_URL = 'https://termac-booking-api.termac-one.workers.dev/book';

function initials(name) {
  return name.split(' ').map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase();
}

async function render() {
  var params = new URLSearchParams(window.location.search);
  var repId = params.get('rep');
  var app = document.getElementById('app');

  if (!repId) {
    app.innerHTML = '<div class="card"><div class="notfound"><h2>Card not found</h2><p style="margin-top:8px">This link doesn\'t match a rep profile. Check the link and try again.</p></div></div>';
    return;
  }

  app.innerHTML = '<div class="card"><div class="notfound">Loading...</div></div>';

  var profile;
  try {
    var res = await fetch(PROFILE_API_URL + '?rep=' + encodeURIComponent(repId));
    var data = await res.json();
    if (!res.ok || !data.ok) {
      if (res.status === 404) {
        app.innerHTML = '<div class="card"><div class="notfound"><h2>Card not found</h2><p style="margin-top:8px">This link doesn\'t match a rep profile. Check the link and try again.</p></div></div>';
      } else {
        app.innerHTML = '<div class="card"><div class="notfound"><h2>Card temporarily unavailable</h2><p style="margin-top:8px">The profile service couldn\'t be reached — this is a configuration issue, not a missing profile. Try again shortly.</p></div></div>';
      }
      return;
    }
    profile = data.profile;
  } catch (e) {
    app.innerHTML = '<div class="card"><div class="notfound"><h2>Couldn\'t load this card</h2><p style="margin-top:8px">Check your connection and try again.</p></div></div>';
    return;
  }

  var divPills = (profile.divisions || []).map(function(d){ return '<span class="div-pill">'+d+'</span>'; }).join('');

  var linkedinRow = profile.linkedin
    ? '<a class="contact-row linkedin-row" href="'+profile.linkedin+'" target="_blank">' +
        '<div class="contact-icon">in</div>' +
        '<div><div class="contact-text">Connect on LinkedIn</div></div>' +
      '</a>'
    : '';

  var phoneRow = profile.phone
    ? '<a class="contact-row" href="tel:'+profile.phone+'">' +
        '<div class="contact-icon">📞</div>' +
        '<div><div class="contact-label">Call</div><div class="contact-text">'+profile.phone+'</div></div>' +
      '</a>'
    : '';

  var emailRow = profile.email
    ? '<a class="contact-row" href="mailto:'+profile.email+'">' +
        '<div class="contact-icon">✉️</div>' +
        '<div><div class="contact-label">Email</div><div class="contact-text">'+profile.email+'</div></div>' +
      '</a>'
    : '';

  var metaLine = [];
  if (profile.yearsExperience) metaLine.push(profile.yearsExperience + '+ years experience');
  if (profile.serviceArea) metaLine.push('Serving ' + profile.serviceArea);

  app.innerHTML =
    '<div class="card">' +
      '<div class="hdr">' +
        '<div class="photo">'+(profile.photoUrl ? '<img src="'+profile.photoUrl+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">' : initials(profile.name))+'</div>' +
        '<div class="name">'+profile.name+'</div>' +
        '<div class="title">'+profile.title+'</div>' +
        '<div class="divisions">'+divPills+'</div>' +
      '</div>' +
      '<div class="body">' +
        (profile.bio ? '<p style="font-size:13px;color:#4B5563;margin-bottom:10px;line-height:1.5">'+profile.bio+'</p>' : '') +
        (metaLine.length ? '<p style="font-size:12px;color:#9CA3AF;margin-bottom:16px">'+metaLine.join(' · ')+'</p>' : '') +
        phoneRow + emailRow + linkedinRow +
        '<button class="cta" onclick="openBookModal(\''+repId+'\', \''+profile.name.replace(/'/g,"\\'")+'\', \''+((profile.divisions && profile.divisions[0]) || '')+'\')">📅 Book an Appointment</button>' +
        '<a class="company-link" href="company-card.html">See all Termac Family of Companies →</a>' +
      '</div>' +
    '</div>';
}

var _currentRepId = null, _currentDivision = null;
function openBookModal(repId, repName, division) {
  _currentRepId = repId;
  _currentDivision = division;
  document.getElementById('modalSub').textContent = 'Send your info and preferred time — this goes straight to ' + repName + '.';
  document.getElementById('bookModal').classList.add('open');
  document.getElementById('bfStatus').className = 'status-msg';
  document.getElementById('bfStatus').textContent = '';
}
function closeBookModal() {
  document.getElementById('bookModal').classList.remove('open');
}

document.getElementById('bookForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var submitBtn = document.getElementById('bfSubmit');
  var statusEl = document.getElementById('bfStatus');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';

  var payload = {
    customerName: document.getElementById('bf_name').value,
    customerPhone: document.getElementById('bf_phone').value,
    customerEmail: document.getElementById('bf_email').value,
    requestedDate: document.getElementById('bf_date').value,
    notes: document.getElementById('bf_notes').value,
    repId: _currentRepId,
    division: _currentDivision,
    website: document.querySelector('input[name="website"]').value, // honeypot
  };

  try {
    var res = await fetch(BOOKING_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    var data = await res.json();
    if (res.ok && data.ok) {
      statusEl.className = 'status-msg success';
      statusEl.textContent = '✓ Request sent! Your rep will follow up shortly.';
      document.getElementById('bookForm').reset();
      setTimeout(closeBookModal, 2000);
    } else {
      statusEl.className = 'status-msg error';
      statusEl.textContent = data.error || 'Something went wrong. Please try again or call directly.';
    }
  } catch (err) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = 'Could not reach the booking service. Please call or email directly.';
  }
  submitBtn.disabled = false;
  submitBtn.textContent = 'Send Request';
});

render();
</script>
</body>
</html>

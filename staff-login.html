<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termac One — Login</title>
<link rel="icon" type="image/png" href="termac-one-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EEF0F2;--panel:#FFF;--ink:#1A1D21;--soft:#5A616B;--line:#D7DBE0;
  --red:#C8102E;--yellow:#F2B705;--green:#1E7B3C;--blue:#1B5FA8;--orange:#D8690B;
  --gray:#6B7280;--radius:10px;--shadow:0 1px 3px rgba(26,29,33,.08),0 4px 14px rgba(26,29,33,.06);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#1A1D21,#0D0F12);color:var(--ink);font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(400px,100%);padding:32px 28px}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:.08em;text-align:center;color:var(--ink);margin-bottom:4px}
.tagline{text-align:center;font-size:12px;color:var(--soft);margin-bottom:24px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:6px}
.btn-ms{background:#fff;color:#1f1f1f;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;text-transform:none;font-weight:700;font-size:15px;padding:13px;font-family:'Barlow',sans-serif}
.btn-ms:hover{background:#F5F6F7}
.hint{font-size:11px;color:var(--soft);margin-top:16px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">TERMAC ONE</div>
  <div class="tagline">Sign in with your company email</div>

  <button class="btn btn-ms" onclick="ssoSignIn()">
    <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
    Sign in with Microsoft
  </button>
  <div class="hint">Use your normal Termac company email address and its password. There is no separate Termac One password.</div>
</div>

<script>
var AUTH_API = 'https://termac-staff-auth.termac-one.workers.dev';

// 2026-07-13, per Ted: invite/resend-invite emails embed a direct
// destination (this person's specific dashboard, e.g.
// gm-dashboard.html?division=allpro for a division GM) as ?dest= on this
// page's URL, instead of just dropping everyone on a generic login page
// with no idea where to go next. Takes priority over any existing
// return_to (an incidental bounce from a different portal mid-session) --
// the destination someone was explicitly invited to is the stronger
// signal. Read once here at load so it survives the redirect out to
// Microsoft and back.
(function captureDestParam(){
  var dest = new URLSearchParams(location.search).get('dest');
  if (dest) sessionStorage.setItem('termac_staff_return_to', dest);
})();

// 2026-07-17: Entra SSO (Altek). Client ID and tenant ID are not secret
// (Azure exposes both in the app registration itself), so they're safe
// to have client-side. Sends the browser straight to Microsoft; nothing
// here ever touches the client secret. Microsoft redirects back to
// auth/callback.html with a one-time code, which does the real exchange
// against termac-staff-auth's /sso-exchange endpoint.
function ssoSignIn(){
  var TENANT_ID = '62642d6d-0c0a-4cba-be8c-5c83f0020c57';
  var CLIENT_ID = '703deca4-b245-49d5-8d17-f354d906321b';
  var REDIRECT_URI = 'https://my.termac.com/auth/callback.html';
  var params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    response_mode: 'query',
    scope: 'openid profile email',
  });
  window.location.href = 'https://login.microsoftonline.com/' + TENANT_ID + '/oauth2/v2.0/authorize?' + params.toString();
}
</script>
</body>
</html>
